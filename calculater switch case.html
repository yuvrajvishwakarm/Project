<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <style>
        body{
         background-color: red;
        }
        div{
            height: 250px;
            width: 300px;
            background-color: rgba(255, 255, 255, 0.664);
            align-items: center;
            margin-top: 150px;
        }
        input{
            margin: 5px;
        }
        p{
            height: 23px;
            width: 100px;
            background-color: white;
            margin-left: -70px;
            text-align: left;
        }
    </style>
</head>
<body>
    <center>
        <div>
             <h1>Simple Calculator</h1>
             <input type="text" id="num1" placeholder="Enter the number"><br>
             <input type="text" id="num2" placeholder="Enter the number"><br>
             <select id="operator">
                 <option value="">Select operator</option>
                 <option value="+">+</option>
                 <option value="-">-</option>
                 <option value="*">*</option>
                 <option value="/">/</option>
             </select> 
             <button onclick="submit()">submit</button>
             <p id="demo">Result</p>
        </div>
    </center>
    <script>
        function submit(){
            let num1 = parseInt(document.getElementById('num1').value);
            let num2 = parseInt(document.getElementById('num2').value);
            let operator = document.getElementById('operator').value;
            let result;
            switch (operator){
                case '+':
                    result=num1+num2;
                    break;
                case '-':
                    result=num1-num2;
                    break;
                case '*':
                    result=num1*num2;
                    break;
                case '/':
                    if (num2!==0){
                        result=num1/num2;
                    } else {
                        result='Error: Divisiable by zero';
                    }
                    break;
                default:
                    result='Please Try Again';
            }
            document.getElementById('demo').innerText=result;
        }
    </script>
</body>
</html>
